apiVersion: v1
kind: Namespace
metadata:
  name: capsule-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: capsule-deploy
  namespace: capsule-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: capsule-deploy-cluster-admin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: cluster-admin
subjects:
  - kind: ServiceAccount
    name: capsule-deploy
    namespace: capsule-system
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: capsule
  namespace: capsule-system
spec:
  interval: 30m
  url: https://projectcapsule.github.io/charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: capsule
  namespace: capsule-system
spec:
  interval: 10m
  serviceAccountName: capsule-deploy
  chart:
    spec:
      chart: capsule
      version: 0.12.4
      sourceRef:
        kind: HelmRepository
        name: capsule
      interval: 2m
  install:
    crds: CreateReplace
  upgrade:
    crds: CreateReplace
    remediation:
      retries: 5
  values:
    proxy:
      enabled: false
    rbac:
      resources:
        # create: true
        labels:
          rbac.authorization.k8s.io/aggregate-to-admin: "true"
      resourcepoolclaims:
        # create: true
        labels:
          rbac.authorization.k8s.io/aggregate-to-admin: "true"
    manager:
      options:
        createConfiguration: true
        capsuleConfiguration: default
        logLevel: "info"
        users:
          - kind: "Group"
            name: "projectcapsule.dev"
          - kind: "Group"
            name: "floral-platform"
          - kind: "User"
            name: "system:serviceaccount:flux-system:kustomize-controller"
        administrators:
          - kind: User
            name: system:serviceaccount:flux-system:kustomize-controller
        allowServiceAccountPromotion: true
        forceTenantPrefix: true
        protectedNamespaceRegex: "^(kube|default|capsule|admin|system|com|org|local|localhost|io)$"
      resources:
        limits:
          cpu: 200m 
          memory: 256Mi
    extraManifests: []


