apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenants
  namespace: flux-system
spec:
  force: false
  interval: 1m
  path: ./tenants
  dependsOn:
  - name: flux-system
  prune: true
  serviceAccountName: kustomize-controller
  sourceRef:
    kind: GitRepository
    name: flux-system
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: capsule
      namespace: capsule-system
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: tenant-resources
  namespace: flux-system
spec:
  force: false
  interval: 1m
  path: ./tenant-resources
  prune: true
  serviceAccountName: kustomize-controller
  dependsOn:
  - name: tenants
  sourceRef:
    kind: GitRepository
    name: flux-system
