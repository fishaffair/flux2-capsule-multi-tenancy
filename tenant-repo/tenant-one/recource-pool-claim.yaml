apiVersion: capsule.clastix.io/v1beta2
kind: ResourcePoolClaim
metadata:
  name: tenant-one-rpc
  namespace: tenant-one-main
spec:
  pool: kind
  claim:
    requests.storage: "100Mi"
    limits.cpu: "100m"
    limits.memory: "100Mi"
---
apiVersion: v1
kind: Pod
metadata:
  name: nginx
  namespace: tenant-one-main
spec:
  containers:
    - name: nginx
      image: nginx:stable
      resources:
        limits:
          memory: "50Mi"
          cpu: "50m"
